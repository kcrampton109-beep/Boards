# CFB Play Card: snapshot lines, run the model engine, publish the board, alert the phone about new plays.
# Same timing as the laptop tasks: engine every 30 min Sun/Mon (when openers post) and hourly otherwise;
# line snapshots every 30 min Fri/Sat and hourly otherwise. Cron is UTC, so the Eastern-time rules are applied in "plan".
name: CFB board
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  push:   # my code changes run straight away (the workflow's own commits never trigger runs)
    branches: [main]
    paths: [".github/**", "cfb/*.py", "cfb/requirements.txt", "cfb/board/index.html", "site/**", "tools/**"]
  workflow_dispatch:
    inputs:
      refresh:
        description: Force a CFBD data refresh (4 API calls)
        type: boolean
        default: false
concurrency:
  group: cfb   # one run at a time per board; boards publish independently (tools/publish_site.sh)
  cancel-in-progress: false
permissions:
  contents: write
env:
  TZ: America/New_York   # naive local times in the engine are Eastern, as on the laptop
  NTFY_TOPIC: boards-pk9lpcuxti4v
  BOARD_URL: https://kcrampton109-beep.github.io/Boards/cfb/
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # first run downloads all history (~20 min); normal runs take 1-2 min
    defaults:
      run:
        working-directory: cfb
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Plan this run (Eastern time rules)
        run: |
          dow=$(date +%u)   # 1 Mon ... 7 Sun, Eastern because of TZ
          half=${{ github.event_name == 'schedule' && github.event.schedule == '37 * * * *' }}
          engine=true; snap=true
          if [ "$half" = "true" ]; then
            case "$dow" in 7|1) ;; *) engine=false ;; esac
            case "$dow" in 5|6) ;; *) snap=false ;; esac
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"; echo "snap=$snap" >> "$GITHUB_OUTPUT"
          echo "engine=$engine snap=$snap (weekday $dow, half-hour run: $half)"
      - id: setup
        if: steps.plan.outputs.engine == 'true' || steps.plan.outputs.snap == 'true'
        uses: ./.github/actions/cfb-setup
        with:
          cfbd-key: ${{ secrets.CFBD_KEY }}
      - name: Snapshot lines
        if: steps.plan.outputs.snap == 'true'
        run: python snap.py --force
      - name: Run engine
        if: steps.plan.outputs.engine == 'true'
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: |
          python engine.py --force ${{ inputs.refresh && '--refresh' || '' }}
          tail -n 1 board/engine.log
          # run logs are owner-only; post an engine error as a run annotation so it can be read without signing in.
          # The engine appends one entry per run: a "YYYY-MM-DD HH:MM ok ..." line, or "YYYY-MM-DD HH:MM ERROR" + traceback.
          last=$(grep -E '^20[0-9]{2}-' board/engine.log | tail -n 1)
          if echo "$last" | grep -q ' ERROR$'; then
            msg=$(awk '/^20[0-9][0-9]-.* ERROR$/{buf=""} {buf=buf $0 "%0A"} END{print buf}' board/engine.log | tail -c 3500)
            echo "::error title=CFB engine::$msg"
            exit 1
          fi
      - id: stage
        name: Stage board + new-play alert text
        if: steps.plan.outputs.engine == 'true'
        run: |
          python sync_prep.py ../_site_cfb | tail -n 1 > ../sync.json
          cat ../sync.json
          python -c "import json;print(json.load(open('../sync.json'))['notify_text'])" > ../notify.txt
      - id: commit
        name: Save ledger, line history and snapshots
        if: steps.plan.outputs.engine == 'true' || steps.plan.outputs.snap == 'true'
        run: |
          git diff --quiet -- board/refresh.json && echo "refreshed=false" >> "$GITHUB_OUTPUT" || echo "refreshed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A board data/calls.log
          if ! git diff --cached --quiet; then
            git commit -q -m "CFB board update $(date '+%a %b %d %I:%M %p ET')"
            for i in 1 2 3 4 5; do   # another board may have pushed first: rebase onto it and retry
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              [ "$i" = 5 ] && exit 1; sleep $((i * 5))
            done
          fi
      - name: Keep the regenerated model tables
        if: steps.commit.outputs.refreshed == 'true' || (steps.setup.outputs.work-hit != 'true' && steps.plan.outputs.engine == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            cfb/data/games.parquet
            cfb/data/tg.parquet
            cfb/data/preds.parquet
            cfb/data/preds_long.parquet
            cfb/data/sit.parquet
            cfb/data/an_team_map.json
            cfb/data/raw/*2026*.json
            cfb/board/model_lines.parquet
            cfb/board/ratings.parquet
          key: cfb-work-${{ github.run_id }}
      - name: Keep line snapshots
        if: steps.plan.outputs.snap == 'true'
        uses: actions/cache/save@v4
        with:
          path: cfb/snapshots
          key: cfb-snap-${{ github.run_id }}
      - name: Publish board
        if: steps.plan.outputs.engine == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ../tools/publish_site.sh cfb ../_site_cfb
      - name: Phone alert
        if: steps.plan.outputs.engine == 'true'
        run: |
          if [ -s ../notify.txt ] && [ -n "$(tr -d '[:space:]' < ../notify.txt)" ]; then
            curl -fsS -H "Title: CFB board" -H "Tags: football" -H "Priority: high" -H "Click: $BOARD_URL" \
              --data-binary @../notify.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            echo "sent: $(cat ../notify.txt)"
          else
            echo "nothing new"
          fi
