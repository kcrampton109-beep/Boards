# Sunday weekly refresh: Saturday's results, re-rate every team, grade the ledger, price the new week,
# write the report + Excel workbook (published next to the board), and send the report to the phone.
# 8:45 AM Eastern all season: 12:45 UTC while on daylight time, 13:45 UTC on standard time (gate job picks).
name: CFB weekly refresh
on:
  schedule:
    - cron: "45 12 * * 0"
    - cron: "45 13 * * 0"
  workflow_dispatch:
concurrency:
  group: cfb   # one run at a time per board; boards publish independently (tools/publish_site.sh)
  cancel-in-progress: false
permissions:
  contents: write
env:
  TZ: America/New_York
  NTFY_TOPIC: boards-pk9lpcuxti4v
  BOARD_URL: https://kcrampton109-beep.github.io/Boards/cfb/
jobs:
  gate:   # the cron that matches today's Eastern offset runs; the other exits (manual runs always go)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          off=$(TZ=America/New_York date +%z)
          sched="${{ github.event.schedule }}"
          go=false
          if [ "${{ github.event_name }}" != "schedule" ]; then go=true
          elif [ "$sched" = "45 12 * * 0" ] && [ "$off" = "-0400" ]; then go=true
          elif [ "$sched" = "45 13 * * 0" ] && [ "$off" = "-0500" ]; then go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "schedule '$sched', Eastern offset $off -> go=$go"
  weekly:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cfb
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cfb-setup
        with:
          cfbd-key: ${{ secrets.CFBD_KEY }}
      - id: weekly
        name: Weekly refresh, report and workbook
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: |
          python weekly.py ../_site_cfb | tail -n 1 > ../weekly.json
          cp exports/CFB_Model_2026.xlsx ../_site_cfb/
          python - <<'EOF'
          import json
          d = json.load(open("../weekly.json"))
          open("../report.txt", "w").write("\n".join(d["report"]))
          EOF
          cat ../report.txt
      - name: Save ledger and ratings history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A board data/calls.log
          if ! git diff --cached --quiet; then
            git commit -q -m "CFB weekly refresh $(date '+%a %b %d')"
            for i in 1 2 3 4 5; do   # another board may have pushed first: rebase onto it and retry
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              [ "$i" = 5 ] && exit 1; sleep $((i * 5))
            done
          fi
      - uses: actions/cache/save@v4
        with:
          path: |
            cfb/data/games.parquet
            cfb/data/tg.parquet
            cfb/data/preds.parquet
            cfb/data/preds_long.parquet
            cfb/data/sit.parquet
            cfb/data/an_team_map.json
            cfb/data/raw/*2026*.json
            cfb/board/model_lines.parquet
            cfb/board/ratings.parquet
          key: cfb-work-${{ github.run_id }}
      - name: Publish board + workbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ../tools/publish_site.sh cfb ../_site_cfb
      - name: Send weekly report
        run: |
          curl -fsS -H "Title: CFB weekly report" -H "Tags: football" -H "Click: $BOARD_URL" \
            -H "Actions: view, Workbook, ${BOARD_URL}CFB_Model_2026.xlsx" \
            --data-binary @../report.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
