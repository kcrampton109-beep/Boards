# Shared setup for the CFB jobs: Python + packages, historical data, regenerated model tables, line snapshots.
# Data lives in the Actions cache (not the public repo). Each cache is restored at the start of a run;
# the workflows save new versions when something changed.
name: CFB setup
description: Prepare the cfb/ folder to run the engine
inputs:
  cfbd-key:
    description: CollegeFootballData API key (only used if the historical data has to be downloaded again)
    required: true
outputs:
  work-hit:
    description: "'true' when the regenerated model tables came back from the cache"
    value: ${{ steps.work.outputs.cache-matched-key != '' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: cfb/requirements.txt
    - shell: bash
      working-directory: cfb
      run: pip install -q -r requirements.txt
    # 1. historical CFBD + Action Network data (static; downloaded once)
    - id: raw
      uses: actions/cache/restore@v4
      with:
        path: |
          cfb/data/raw
          cfb/data/an_raw
        key: cfb-raw-v1
    - name: Download historical data (first run or cache lost)
      if: steps.raw.outputs.cache-hit != 'true'
      shell: bash
      working-directory: cfb
      env:
        CFBD_KEY: ${{ inputs.cfbd-key }}
      run: python bootstrap.py
    - if: steps.raw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          cfb/data/raw
          cfb/data/an_raw
        key: cfb-raw-v1
    # 2. tables the engine regenerates on each data refresh (on a miss the engine refreshes and rebuilds them)
    - id: work
      uses: actions/cache/restore@v4
      with:
        path: |
          cfb/data/games.parquet
          cfb/data/tg.parquet
          cfb/data/preds.parquet
          cfb/data/preds_long.parquet
          cfb/data/sit.parquet
          cfb/data/an_team_map.json
          cfb/data/raw/*2026*.json
          cfb/board/model_lines.parquet
          cfb/board/ratings.parquet
        key: cfb-work-${{ github.run_id }}
        restore-keys: cfb-work-
    # 3. line snapshots (research history of every book's lines)
    - uses: actions/cache/restore@v4
      with:
        path: cfb/snapshots
        key: cfb-snap-${{ github.run_id }}
        restore-keys: cfb-snap-
